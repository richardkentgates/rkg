<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="Georgia, serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2d8cf0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="35" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">The Information-Distance-Time Triangle</text>
  <text x="300" y="55" text-anchor="middle" font-size="11" fill="#888">The foundation of existence</text>

  <!-- Triangle vertices -->
  <!-- Top: DISTANCE -->
  <circle cx="300" cy="120" r="50" fill="#2d8cf0" opacity="0.15" stroke="#2d8cf0" stroke-width="2"/>
  <text x="300" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d8cf0">DISTANCE</text>
  <text x="300" y="135" text-anchor="middle" font-size="11" fill="#555">Δx</text>

  <!-- Bottom-left: TIME -->
  <circle cx="120" cy="380" r="50" fill="#e74c3c" opacity="0.15" stroke="#e74c3c" stroke-width="2"/>
  <text x="120" y="375" text-anchor="middle" font-size="14" font-weight="bold" fill="#e74c3c">TIME</text>
  <text x="120" y="395" text-anchor="middle" font-size="11" fill="#555">dτ</text>

  <!-- Bottom-right: INFORMATION -->
  <circle cx="480" cy="380" r="50" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="2"/>
  <text x="480" y="375" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">INFORMATION</text>
  <text x="480" y="395" text-anchor="middle" font-size="11" fill="#555">I</text>

  <!-- Edges with labels -->
  <!-- Distance -> Time (left edge) -->
  <line x1="265" y1="160" x2="145" y2="340" stroke="#2d8cf0" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="265" y1="160" x2="145" y2="340" stroke="#e74c3c" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="4,4" transform="translate(-15, 10)"/>
  <text x="170" y="240" font-size="11" fill="#333" transform="rotate(-55, 170, 240)">Distance requires time</text>
  <text x="170" y="255" font-size="9" fill="#888" transform="rotate(-55, 170, 255)">(signal propagation)</text>

  <!-- Time -> Information (bottom edge) -->
  <line x1="175" y1="380" x2="425" y2="380" stroke="#e74c3c" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="175" y1="380" x2="425" y2="380" stroke="#27ae60" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="4,4" transform="translate(0, 12)"/>
  <text x="300" y="375" text-anchor="middle" font-size="11" fill="#333">Time is information</text>
  <text x="300" y="410" text-anchor="middle" font-size="9" fill="#888">(state changes = bits)</text>

  <!-- Information -> Distance (right edge) -->
  <line x1="455" y1="340" x2="335" y2="160" stroke="#27ae60" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="455" y1="340" x2="335" y2="160" stroke="#2d8cf0" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="4,4" transform="translate(15, 10)"/>
  <text x="440" y="240" font-size="11" fill="#333" transform="rotate(55, 440, 240)">Information requires distance</text>
  <text x="440" y="255" font-size="9" fill="#888" transform="rotate(55, 440, 255)">(Bekenstein bound: I ~ R·E)</text>

  <!-- Center label -->
  <text x="300" y="300" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a2233">MEASURE</text>

  <!-- Planck scale annotation -->
  <rect x="180" y="440" width="240" height="50" rx="6" fill="#1a2233" opacity="0.9"/>
  <text x="300" y="460" text-anchor="middle" font-size="11" fill="#c8d8f0">At Planck scale: l_Pl = c · t_Pl</text>
  <text x="300" y="478" text-anchor="middle" font-size="11" fill="#c8d8f0">Distance IS time. I ≈ 9.06 bits.</text>
</svg>
