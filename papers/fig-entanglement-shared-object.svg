<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Georgia, serif">
  <defs>
    <linearGradient id="infoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2d8cf0;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#2d8cf0;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#2d8cf0;stop-opacity:0.3"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Entanglement: A Single Information Object Across Two Time Densities</text>

  <!-- Endpoint A -->
  <circle cx="150" cy="200" r="40" fill="#2d8cf0" opacity="0.8"/>
  <text x="150" y="205" text-anchor="middle" font-size="16" fill="white" font-weight="bold">A</text>
  <text x="150" y="260" text-anchor="middle" font-size="12" fill="#555">Endpoint A</text>
  <text x="150" y="278" text-anchor="middle" font-size="11" fill="#888">Local clock: τ_A</text>

  <!-- Endpoint B -->
  <circle cx="650" cy="200" r="40" fill="#2d8cf0" opacity="0.8"/>
  <text x="650" y="205" text-anchor="middle" font-size="16" fill="white" font-weight="bold">B</text>
  <text x="650" y="260" text-anchor="middle" font-size="12" fill="#555">Endpoint B</text>
  <text x="650" y="278" text-anchor="middle" font-size="11" fill="#888">Local clock: τ_B ≠ τ_A</text>

  <!-- Shared information object (braided connection) -->
  <path d="M190,200 C250,140 350,140 400,200 C450,260 550,260 610,200" stroke="url(#infoGrad)" stroke-width="8" fill="none" opacity="0.7"/>
  <path d="M190,200 C250,260 350,260 400,200 C450,140 550,140 610,200" stroke="url(#infoGrad)" stroke-width="8" fill="none" opacity="0.7"/>

  <!-- Information object label -->
  <rect x="310" y="155" width="180" height="30" rx="6" fill="#1a2233" opacity="0.9"/>
  <text x="400" y="175" text-anchor="middle" font-size="13" fill="#c8d8f0" font-weight="bold">I_AB = I_A = I_B</text>
  <text x="400" y="148" text-anchor="middle" font-size="11" fill="#888">Single information object</text>

  <!-- Distance arrow -->
  <line x1="200" y1="310" x2="600" y2="310" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)" marker-start="url(#arrowhead)"/>
  <text x="400" y="330" text-anchor="middle" font-size="12" fill="#555">Δx (distance)</text>

  <!-- Time flow arrows -->
  <path d="M100,120 L100,80" stroke="#2d8cf0" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="100" y="72" text-anchor="middle" font-size="10" fill="#2d8cf0">Time flows here</text>
  <path d="M700,120 L700,80" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="700" y="72" text-anchor="middle" font-size="10" fill="#e74c3c">Time flows differently here</text>

  <!-- Key insight box -->
  <rect x="200" y="350" width="400" height="40" rx="6" fill="#f0f7ff" stroke="#b8d4f0"/>
  <text x="400" y="375" text-anchor="middle" font-size="12" fill="#333">φ_A − φ_B = constant → Entanglement preserved</text>

  <!-- Phase annotations -->
  <text x="150" y="170" text-anchor="middle" font-size="10" fill="#2d8cf0">φ_A(t)</text>
  <text x="650" y="170" text-anchor="middle" font-size="10" fill="#2d8cf0">φ_B(t)</text>
</svg>
