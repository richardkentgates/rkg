<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" font-family="Georgia, serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
  </defs>

  <rect width="700" height="500" fill="#fafafa"/>

  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">The Unified Correction Law: One Law, All Sectors</text>

  <!-- Central hub -->
  <circle cx="350" cy="250" r="70" fill="#1a2233"/>
  <text x="350" y="240" text-anchor="middle" font-size="13" fill="#c8d8f0" font-weight="bold">X_eff = X_0</text>
  <text x="350" y="260" text-anchor="middle" font-size="13" fill="#c8d8f0" font-weight="bold">(1 + c_X · G)</text>
  <text x="350" y="285" text-anchor="middle" font-size="10" fill="#888">2 free parameters</text>

  <!-- Sector 1: Decay (top-left) -->
  <rect x="60" y="60" width="140" height="70" rx="8" fill="#e74c3c" opacity="0.15" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="130" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#e74c3c">Decay Rates</text>
  <text x="130" y="108" text-anchor="middle" font-size="10" fill="#e74c3c">λ_eff = λ_0(1 + c_λ G)</text>
  <line x1="200" y1="95" x2="285" y2="215" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Sector 2: Gravity (top-right) -->
  <rect x="500" y="60" width="140" height="70" rx="8" fill="#2d8cf0" opacity="0.15" stroke="#2d8cf0" stroke-width="1.5"/>
  <text x="570" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d8cf0">Gravity</text>
  <text x="570" y="108" text-anchor="middle" font-size="10" fill="#2d8cf0">g_eff = g_0(1 + c_g G)</text>
  <line x1="500" y1="95" x2="415" y2="215" stroke="#2d8cf0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Sector 3: Inertia (left) -->
  <rect x="30" y="220" width="140" height="70" rx="8" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
  <text x="100" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Inertia</text>
  <text x="100" y="268" text-anchor="middle" font-size="10" fill="#27ae60">a_eff = a_0(1 + c_a G)</text>
  <line x1="170" y1="255" x2="280" y2="250" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Sector 4: Fine Structure (right) -->
  <rect x="530" y="220" width="140" height="70" rx="8" fill="#f39c12" opacity="0.15" stroke="#f39c12" stroke-width="1.5"/>
  <text x="600" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#f39c12">Fine Structure</text>
  <text x="600" y="268" text-anchor="middle" font-size="10" fill="#f39c12">α(φ) = α_0(1 + d_α G)</text>
  <line x1="530" y1="255" x2="420" y2="250" stroke="#f39c12" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Sector 5: Mass Ratio (bottom) -->
  <rect x="265" y="390" width="170" height="70" rx="8" fill="#9b59b6" opacity="0.15" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="350" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#9b59b6">Mass Ratio</text>
  <text x="350" y="438" text-anchor="middle" font-size="10" fill="#9b59b6">μ(φ) = μ_0(1 + d_μ G)</text>
  <line x1="350" y1="390" x2="350" y2="320" stroke="#9b59b6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Parameter labels -->
  <text x="130" y="160" text-anchor="middle" font-size="9" fill="#888">c_λ = Q_α d_α + Q_μ d_μ</text>
  <text x="570" y="160" text-anchor="middle" font-size="9" fill="#888">c_g = Σ f_i(d_α + β_i d_μ)</text>
  <text x="70" y="310" text-anchor="middle" font-size="9" fill="#888">same as gravity</text>
  <text x="630" y="310" text-anchor="middle" font-size="9" fill="#888">d_α</text>
  <text x="350" y="375" text-anchor="middle" font-size="9" fill="#888">d_μ</text>

  <!-- Bottom annotation -->
  <rect x="150" y="475" width="400" height="20" rx="4" fill="#f0f7ff"/>
  <text x="350" y="490" text-anchor="middle" font-size="10" fill="#555">Two free parameters (d_α, d_μ). All sectors. All scales.</text>
</svg>
