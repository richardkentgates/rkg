<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Georgia, serif">
  <defs>
    <linearGradient id="scaleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.2"/>
      <stop offset="50%" style="stop-color:#f39c12;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#2d8cf0;stop-opacity:0.2"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="#fafafa"/>

  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">The Same Field at Every Scale</text>

  <!-- Scale axis -->
  <rect x="50" y="350" width="700" height="8" rx="4" fill="url(#scaleGrad)"/>
  <text x="50" y="380" font-size="11" fill="#e74c3c">Planck scale (10⁻³⁵ m)</text>
  <text x="400" y="380" text-anchor="middle" font-size="11" fill="#f39c12">Atomic → Stellar</text>
  <text x="750" y="380" text-anchor="end" font-size="11" fill="#2d8cf0">Cosmological (10²⁶ m)</text>
  <text x="400" y="398" text-anchor="middle" font-size="10" fill="#888">SCALE →</text>

  <!-- QM region (left) -->
  <rect x="60" y="80" width="200" height="240" rx="10" fill="#e74c3c" opacity="0.08" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="160" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#e74c3c">QM SEES</text>

  <!-- QM wave (small oscillation) -->
  <path d="M80,180 Q100,160 120,180 Q140,200 160,180 Q180,160 200,180 Q220,200 240,180" stroke="#e74c3c" stroke-width="2" fill="none"/>
  <text x="160" y="220" text-anchor="middle" font-size="10" fill="#e74c3c">High-frequency oscillation</text>
  <text x="160" y="238" text-anchor="middle" font-size="10" fill="#e74c3c">Vacuum fluctuations</text>
  <text x="160" y="256" text-anchor="middle" font-size="10" fill="#e74c3c">Zero-point energy</text>

  <!-- GR region (right) -->
  <rect x="540" y="80" width="200" height="240" rx="10" fill="#2d8cf0" opacity="0.08" stroke="#2d8cf0" stroke-width="1.5"/>
  <text x="640" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d8cf0">GR SEES</text>

  <!-- GR wave (large curvature) -->
  <path d="M560,180 Q600,140 640,180 Q680,220 720,180" stroke="#2d8cf0" stroke-width="2.5" fill="none"/>
  <text x="640" y="220" text-anchor="middle" font-size="10" fill="#2d8cf0">Low-frequency gradient</text>
  <text x="640" y="238" text-anchor="middle" font-size="10" fill="#2d8cf0">Spacetime curvature</text>
  <text x="640" y="256" text-anchor="middle" font-size="10" fill="#2d8cf0">Dark energy</text>

  <!-- Same field label -->
  <rect x="300" y="150" width="200" height="60" rx="8" fill="#1a2233"/>
  <text x="400" y="175" text-anchor="middle" font-size="14" fill="#c8d8f0" font-weight="bold">SAME FIELD</text>
  <text x="400" y="195" text-anchor="middle" font-size="11" fill="#c8d8f0">G(t) = 10⁻³ + 10⁻⁴cos(2πt)</text>

  <!-- Connecting arrows -->
  <path d="M260,180 L300,180" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M500,180 L540,180" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Bottom annotation -->
  <rect x="150" y="290" width="500" height="35" rx="6" fill="#f0f7ff" stroke="#b8d4f0"/>
  <text x="400" y="312" text-anchor="middle" font-size="11" fill="#333">The cosmological constant problem dissolves: vacuum energy IS dark energy.</text>
</svg>
