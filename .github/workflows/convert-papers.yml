name: Convert HTML Papers to TeX and PDF

on:
  push:
    branches:
      - master
    paths:
      - 'papers/*.html'
      - 'papers/fig-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-science librsvg2-bin

      - name: Convert SVG figures to PDF
        run: |
          cd papers
          for svg in fig-*.svg; do
            base=$(basename "$svg" .svg)
            echo "Converting $svg -> ${base}.pdf"
            rsvg-convert -f pdf "$svg" > "${base}.pdf" 2>/dev/null || echo "  FAILED: $svg"
          done

      - name: Convert HTML to TeX
        run: |
          cat > /tmp/header.tex << 'TEX'
          \usepackage{amsmath,amssymb,amsfonts}
          \usepackage{graphicx}
          \usepackage{booktabs}
          \usepackage{microtype}
          \usepackage{breakurl}
          \usepackage[breaklinks=true]{hyperref}
          \usepackage{enumitem}
          \setlist{noitemsep,topsep=0pt}
          \allowdisplaybreaks
          \sloppy
          TEX

          for html in papers/*.html; do
            base=$(basename "$html" .html)
            echo "Converting $base.html -> $base.tex"
            pandoc "$html" \
              -f html \
              -t latex \
              --wrap=auto \
              --standalone \
              -V documentclass=article \
              -V geometry:margin=1in \
              -V fontsize=11pt \
              -H /tmp/header.tex \
              --metadata title="" \
              -o "papers/$base.tex"
            # Fix: \includesvg{foo.svg} -> \includegraphics{foo} (use PDF version)
            sed -i 's/\\includesvg{\([^}]*\)\.svg}/\\includegraphics{\1}/g' "papers/$base.tex"
            sed -i 's/\\includesvg{\([^}]*\)}/\\includegraphics{\1}/g' "papers/$base.tex"
            # Also fix any remaining \includegraphics with .svg extension
            sed -i 's/\\includegraphics{\([^}]*\)\.svg}/\\includegraphics{\1}/g' "papers/$base.tex"
          done

      - name: Compile TeX to PDF
        run: |
          cd papers
          for tex in *.tex; do
            base=$(basename "$tex" .tex)
            echo "Compiling $base.tex -> $base.pdf"
            pdflatex -interaction=nonstopmode "$tex" > /dev/null 2>&1 || true
            bibtex "$base" > /dev/null 2>&1 || true
            pdflatex -interaction=nonstopmode "$tex" > /dev/null 2>&1 || true
            pdflatex -interaction=nonstopmode "$tex" > /dev/null 2>&1 || true
            if [ -f "${base}.pdf" ]; then
              echo "  OK: ${base}.pdf"
            else
              echo "  FAILED: ${base}.pdf"
            fi
          done

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add papers/*.tex papers/*.pdf papers/fig-*.pdf
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-convert HTML papers to TeX and PDF [skip ci]"
            git push
          fi
