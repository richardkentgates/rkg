name: Convert HTML Papers to TeX and PDF

on:
  push:
    branches:
      - master
    paths:
      - 'papers/*.html'
      - 'papers/fig-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Convert HTML to PDF via headless browser
        run: |
          cd papers
          for html in *.html; do
            base=$(basename "$html" .html)
            echo "Converting $base.html -> $base.pdf"
            google-chrome-stable --headless --disable-gpu --no-sandbox \
              --print-to-pdf="${base}.pdf" \
              --print-to-pdf-no-header \
              "file://$(pwd)/${html}" 2>/dev/null || echo "  FAILED: $html"
          done

      - name: Convert HTML to TeX via pandoc
        run: |
          cd papers
          for html in *.html; do
            base=$(basename "$html" .html)
            echo "Converting $base.html -> $base.tex"
            pandoc "$html" \
              -f html+tex_math_dollars \
              -t latex \
              --wrap=auto \
              --standalone \
              -V documentclass=article \
              -V geometry:margin=0.75in \
              -V fontsize=10pt \
              --metadata title="" \
              -o "${base}.tex"
          done

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add papers/*.tex papers/*.pdf
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-convert HTML papers to TeX and PDF [skip ci]"
            git push
          fi
